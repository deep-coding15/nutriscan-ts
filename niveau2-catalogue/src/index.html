<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriScan — Niveau 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-amber-50 py-10 px-4">

<div class="max-w-2xl mx-auto">

  <!-- Badge niveau -->
  <span class="inline-block text-xs font-semibold tracking-widest uppercase bg-emerald-600 text-white px-3 py-1 rounded-full mb-4">
            Niveau 2 — Typescript
        </span>

  <!-- Titre -->
  <h1 class="text-3xl font-bold text-gray-900 mb-1">Scanner de produit</h1>
  <p class="text-gray-500 text-sm mb-8">
    Recherche un aliment et affiche ses infos nutritionnelles depuis Open Food Facts.
  </p>

  <!-- Barre de recherche -->
  <div class="flex gap-2 mb-6">
    <input
            type="text"
            id="searchValue"
            placeholder="ex: nutella, coca-cola, haribo..."
            class="flex-1 h-11 px-4 rounded-xl border border-gray-200 bg-white text-gray-900 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
    />
    <button
            type="submit"
            id="btn-rechercher"
            class="h-11 px-5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-xl transition"
    >
      Rechercher
    </button>
  </div>

  <!-- Filtres + Tri -->
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <div class="flex gap-1" id="filtres">
      <button data-grade="tous" class="filtre-btn px-3 py-1 rounded-full text-xs font-semibold border-2 border-gray-300 text-gray-500 transition active">Tous</button>
      <button data-grade="a"    class="filtre-btn px-3 py-1 rounded-full text-xs font-semibold border-2 border-[#1D9E75] text-[#1D9E75] transition">A</button>
      <button data-grade="b"    class="filtre-btn px-3 py-1 rounded-full text-xs font-semibold border-2 border-[#639922] text-[#639922] transition">B</button>
      <button data-grade="c"    class="filtre-btn px-3 py-1 rounded-full text-xs font-semibold border-2 border-[#D4AC0D] text-[#D4AC0D] transition">C</button>
      <button data-grade="d"    class="filtre-btn px-3 py-1 rounded-full text-xs font-semibold border-2 border-[#E67E22] text-[#E67E22] transition">D</button>
      <button data-grade="e"    class="filtre-btn px-3 py-1 rounded-full text-xs font-semibold border-2 border-[#E24B4A] text-[#E24B4A] transition">E</button>
    </div>
    <select id="tri" class="ml-auto h-8 px-3 rounded-lg border border-gray-200 bg-white text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <option value="defaut">Trier par défaut</option>
      <option value="nom">Trier par nom</option>
      <option value="categorie">Trier par catégorie</option>
      <option value="nutriscore">Trier par Nutri-Score</option>
    </select>
  </div>

  <!-- Compteur résultats -->
  <p id="compteur" class="text-sm text-gray-500 mb-3 hidden">
    <span class="font-semibold text-gray-900" id="nbProduits"></span> produits trouvés pour
    <span class="font-semibold text-gray-900" id="queryAffichee"></span>
  </p>

  <!-- Liste de résultats -->
  <div class="flex flex-col gap-3 mb-8" id="resultats"></div>

  <!-- Concepts TS -->
  <div class="pt-6 border-t border-gray-200">
    <h3 class="text-xs uppercase tracking-widest text-gray-400 mb-3">Concepts TS travaillés</h3>
    <div class="flex flex-wrap gap-2">
      <span class="text-xs font-mono bg-gray-100 text-gray-600 px-3 py-1 rounded-full">interface Product</span>
      <span class="text-xs font-mono bg-gray-100 text-gray-600 px-3 py-1 rounded-full">interface Nutriment</span>
      <span class="text-xs font-mono bg-gray-100 text-gray-600 px-3 py-1 rounded-full">type NutriScore</span>
      <span class="text-xs font-mono bg-gray-100 text-gray-600 px-3 py-1 rounded-full">fetch typés</span>
      <span class="text-xs font-mono bg-gray-100 text-gray-600 px-3 py-1 rounded-full">null / undefined</span>
      <span class="text-xs font-mono bg-gray-100 text-gray-600 px-3 py-1 rounded-full">Array.filter()</span>
      <span class="text-xs font-mono bg-gray-100 text-gray-600 px-3 py-1 rounded-full">Array.sort()</span>
    </div>
  </div>
</div>
<script src="../dist/bundle.js"></script>
</body>
</html>
